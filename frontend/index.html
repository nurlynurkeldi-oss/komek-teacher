<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Komek Teacher</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <!-- Login / register screen -->
  <section id="auth-screen" class="auth hidden">
    <div class="auth-card">
      <img class="logo-full" src="/static/img/logo-full.png" alt="Komek Teacher — Мұғалімге көмектесу">
      <div class="lang-switch"><button data-lang="kk">ҚАЗ</button><button data-lang="ru">РУС</button></div>
      <form id="auth-form">
        <h2 id="auth-title"></h2>
        <div class="reg-only"><label data-i18n="fullName"></label><input name="full_name" /></div>
        <label data-i18n="email"></label><input name="email" type="email" required />
        <label data-i18n="password"></label><input name="password" type="password" minlength="6" required />
        <div class="reg-only"><label data-i18n="school"></label><input name="school" /></div>
        <div class="reg-only"><label data-i18n="subject"></label><input name="subject" /></div>
        <p class="error" id="auth-error"></p>
        <button class="btn primary wide" id="auth-submit"></button>
        <p class="muted center"><span id="auth-switch-text"></span> <a href="#" id="auth-switch"></a></p>
      </form>
    </div>
  </section>

  <!-- Main app -->
  <div id="app" class="layout hidden">
    <aside class="sidebar" id="sidebar">
      <div class="sb-head">
        <div class="brand"><img class="logo-img" src="/static/img/logo-mark.png" alt="Komek Teacher"><div class="label"><b>Komek Teacher</b><small data-i18n="appTagline"></small></div></div>
        <button class="collapse-btn" id="collapse-btn" aria-label="Collapse menu" title="Collapse">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>
      <p class="menu-label label" data-i18n="mainMenu"></p>
      <nav class="sb-nav">
        <a href="#/home" data-route="home"><span class="ic blue">⌂</span><span class="label" data-i18n="navHome"></span></a>
        <a href="#/ai" data-route="ai"><span class="ic orange">✦</span><span class="label" data-i18n="navAI"></span></a>
        <a href="#/lessons" data-route="lessons"><span class="ic purple">▤</span><span class="label" data-i18n="navLessons"></span></a>
        <a href="#/assignments" data-route="assignments"><span class="ic pink">✎</span><span class="label" data-i18n="navAssignments"></span></a>
        <a href="#/attendance" data-route="attendance"><span class="ic teal">✓</span><span class="label" data-i18n="navAttendance"></span></a>
        <a href="#/materials" data-route="materials"><span class="ic green">⧉</span><span class="label" data-i18n="navMaterials"></span></a>
      </nav>
      <div class="sidebar-bottom">
        <div class="lang-switch"><button data-lang="kk">ҚАЗ</button><button data-lang="ru">РУС</button></div>
        <div class="user-card">
          <div class="avatar" id="user-avatar">A</div>
          <div class="grow label"><b id="user-name"></b><small data-i18n="educator"></small></div>
          <button class="icon-btn" id="logout-btn" title="Logout" aria-label="Logout">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <main id="view" class="content"></main>
  </div>

  <!-- Student page (opened from the teacher's link, no login) -->
  <section id="public-screen" class="public hidden">
    <div class="lang-switch"><button data-lang="kk">ҚАЗ</button><button data-lang="ru">РУС</button></div>
    <div id="public-view"></div>
  </section>

  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/photo-picker.js"></script>
  <script src="/static/js/checking.js"></script>
  <script src="/static/js/attendance.js"></script>
</body>
</html>
